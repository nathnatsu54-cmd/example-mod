name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Geode CLI
        run: |
          curl -L https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux -o geode
          chmod +x geode

      - name: Build
        run: ./geode build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/*.geode
