name: Build Geode Mod (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

env:
  MOD_PATH: .                    # Si ton mod est à la racine, sinon mets le nom du dossier
  # GEODE_VERSION: "nightly"     # Décommente si tu veux la version nightly

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout your mod
        uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@v1
        with:
          path: ${{ env.MOD_PATH }}
          build-config: RelWithDebInfo
          # sdk: nightly          # si tu veux la nightly
          export-pdb: true
          bundle-pdb: true
          export-symbols: true

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}
          path: "*.geode"
