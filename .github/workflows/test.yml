name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    uses: geode-sdk/build-e2e/.github/workflows/build.yml@main
    with:
      bindings-ref: main
      cli-ref: main
      build-config: Release
      target: windows
      # Cette ligne demande explicitement au workflow de Geode de créer l'artifact
      upload-artifact: true
